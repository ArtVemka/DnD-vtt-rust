name: Linux release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the Linux bundles to
        required: true
        default: v0.1.0
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file patchelf \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Build AppImage and deb
        working-directory: crates/dnd-desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npx --yes @tauri-apps/cli@2 build

      - name: Attach bundles to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" \
            target/release/bundle/appimage/*.AppImage \
            target/release/bundle/deb/*.deb \
            --clobber
