name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish
        required: true
        default: v0.2.0

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-22.04
    steps:
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          NOTES=$'Порт стола D&D 5e на Rust и Tauri 2.\n\nУстановленная версия обновляется сама: проверка при запуске, затем Настройки → Обновления. Кампании и настройки лежат в отдельной папке и при обновлении не удаляются.\n\nФайлы: установщик и портативная сборка для Windows, AppImage и deb для Linux.'
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft \
            --title "DnD Table $RELEASE_TAG" --notes "$NOTES"

  # Windows-раннеры на этом аккаунте не стартуют (GitHub отдаёт internal
  # server error), поэтому Windows-сборка делается локально и загружается
  # в черновик релиза перед запуском этого workflow.
  build:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file patchelf \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Build bundles
        working-directory: crates/dnd-desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npx --yes @tauri-apps/cli@2 build

      - name: Upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          upload() {
            gh release upload "$RELEASE_TAG" "$@" --repo "$GITHUB_REPOSITORY" --clobber
          }
          if [ -d target/release/bundle/nsis ]; then
            upload target/release/bundle/nsis/*.exe target/release/bundle/nsis/*.sig
          fi
          if [ -d target/release/bundle/msi ]; then
            upload target/release/bundle/msi/*.msi target/release/bundle/msi/*.sig
          fi
          if [ -d target/release/bundle/appimage ]; then
            upload target/release/bundle/appimage/*.AppImage target/release/bundle/appimage/*.sig
          fi
          if [ -d target/release/bundle/deb ]; then
            upload target/release/bundle/deb/*.deb target/release/bundle/deb/*.sig
          fi
          if [ -f dist/DnD-Table-portable.zip ]; then
            upload dist/DnD-Table-portable.zip
          fi

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Assemble latest.json and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p sigs
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.sig" --dir sigs
          assets=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          win=$(echo "$assets" | grep -E 'setup\.exe$' | head -n1)
          app=$(echo "$assets" | grep -E '\.AppImage$' | head -n1)
          version="${RELEASE_TAG#v}"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          jq -n \
            --arg version "$version" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg win "$base/$win" --arg winsig "$(cat "sigs/$win.sig")" \
            --arg app "$base/$app" --arg appsig "$(cat "sigs/$app.sig")" \
            '{version: $version, pub_date: $date, platforms: {
              "windows-x86_64": {signature: $winsig, url: $win},
              "linux-x86_64": {signature: $appsig, url: $app}
            }}' > latest.json
          gh release upload "$RELEASE_TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
